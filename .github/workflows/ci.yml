name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.1

      - name: Lint
        run: python -m ruff check .

      - name: Verify formatting
        run: python -m ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install development environment
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install --disable-pip-version-check \
            -r requirements-dev.txt

      - name: Run dataset-free test suite with coverage
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/gridworld-matplotlib
          XDG_CACHE_HOME: /tmp/gridworld-cache
        run: python -m pytest

      - name: Smoke-test CLI
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/gridworld-matplotlib
          XDG_CACHE_HOME: /tmp/gridworld-cache
        run: |
          python -m gridworld_rl --help
          gridworld-rl --help

      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build

      - name: Smoke-test the built wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m pip uninstall --yes gridworld-offline-rl
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -m gridworld_rl --help
          gridworld-rl --help

      - name: Upload distributions
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
